name: Build Safestrap APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Generate Android project
        run: |
          flutter create --platforms=android --org com.kanyeweststudio .
          rm -f test/widget_test.dart

      - name: Patch AndroidManifest
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />\n    <queries>\n        <package android:name="com.roblox.client" />\n    </queries>\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: safestrap-apk
          path: build/app/outputs/flutter-apk/app-release.apk
